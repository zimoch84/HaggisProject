asyncapi: 2.6.0
info:
  title: Haggis Infrastructure Async API
  version: 3.0.0
  description: Realtime API based on operation envelopes.
defaultContentType: application/json

servers:
  ws:
    url: localhost:8080
    protocol: ws
    description: WebSocket endpoints

channels:
  ws/global/chat:
    description: Global chat channel. On connect server returns room list and recent global chat history.
    publish:
      operationId: sendGlobalOperation
      message:
        oneOf:
          - $ref: "#/components/messages/GlobalChatOperationMessage"
          - $ref: "#/components/messages/GlobalListRoomOperationMessage"
          - $ref: "#/components/messages/GlobalCreateRoomOperationMessage"
          - $ref: "#/components/messages/GlobalPrivateChatOperationMessage"
    subscribe:
      operationId: receiveGlobalOperation
      message:
        $ref: "#/components/messages/GlobalOperationEnvelopeMessage"

  ws/games/{gameId}:
    description: Game channel with operation-based commands.
    parameters:
      gameId:
        schema:
          type: string
          minLength: 1
    publish:
      operationId: sendGameOperation
      message:
        oneOf:
          - $ref: "#/components/messages/GameJoinOperationMessage"
          - $ref: "#/components/messages/GameCreateOperationMessage"
          - $ref: "#/components/messages/GameChatOperationMessage"
          - $ref: "#/components/messages/GameCommandOperationMessage"
          - $ref: "#/components/messages/GameSnapshotOperationMessage"
    subscribe:
      operationId: receiveGameOperation
      message:
        $ref: "#/components/messages/GameOperationEnvelopeMessage"

components:
  messages:
    GlobalChatOperationMessage:
      payload:
        $ref: "#/components/schemas/GlobalChatOperation"
    GlobalListRoomOperationMessage:
      payload:
        $ref: "#/components/schemas/GlobalListRoomOperation"
    GlobalCreateRoomOperationMessage:
      payload:
        $ref: "#/components/schemas/GlobalCreateRoomOperation"
    GlobalPrivateChatOperationMessage:
      payload:
        $ref: "#/components/schemas/GlobalPrivateChatOperation"
    GlobalOperationEnvelopeMessage:
      payload:
        $ref: "#/components/schemas/GlobalOperationEnvelope"

    GameJoinOperationMessage:
      payload:
        $ref: "#/components/schemas/GameJoinOperation"
    GameCreateOperationMessage:
      payload:
        $ref: "#/components/schemas/GameCreateOperation"
    GameChatOperationMessage:
      payload:
        $ref: "#/components/schemas/GameChatOperation"
    GameCommandOperationMessage:
      payload:
        $ref: "#/components/schemas/GameCommandOperation"
    GameSnapshotOperationMessage:
      payload:
        $ref: "#/components/schemas/GameSnapshotOperation"
    GameOperationEnvelopeMessage:
      payload:
        $ref: "#/components/schemas/GameOperationEnvelope"

  schemas:
    GlobalOperationEnvelope:
      type: object
      required: [operation, data]
      additionalProperties: true
      properties:
        messageKind:
          type: string
          enum: [response, event]
        operation:
          type: string
          enum: [bootstrap, chat, listroom, createroom, privatechat, unknown]
        data:
          type: object
          additionalProperties: true

    GlobalChatOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [chat]
        payload:
          $ref: "#/components/schemas/SendChatMessageRequest"

    GlobalListRoomOperation:
      type: object
      required: [operation]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [listroom]
        payload:
          type: object
          nullable: true
          additionalProperties: true

    GlobalCreateRoomOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [createroom]
        payload:
          $ref: "#/components/schemas/CreateRoomRequest"

    GlobalPrivateChatOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [privatechat]
        payload:
          $ref: "#/components/schemas/PrivateChatRequest"

    GameOperationEnvelope:
      type: object
      required: [operation, data]
      additionalProperties: true
      properties:
        messageKind:
          type: string
          enum: [response, event]
        operation:
          type: string
          enum: [join, create, chat, command, snapshot, unknown]
        data:
          type: object
          additionalProperties: true

    GameJoinOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [join]
        payload:
          $ref: "#/components/schemas/JoinPayload"

    GameCreateOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [create]
        payload:
          $ref: "#/components/schemas/CreatePayload"

    GameChatOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [chat]
        payload:
          $ref: "#/components/schemas/GameChatMessage"

    GameCommandOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [command]
        payload:
          $ref: "#/components/schemas/CommandPayload"

    GameSnapshotOperation:
      type: object
      required: [operation, payload]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [snapshot]
        payload:
          $ref: "#/components/schemas/SnapshotPayload"

    SendChatMessageRequest:
      type: object
      required: [playerId, text]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1

    CreateRoomRequest:
      type: object
      required: [playerId]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1
        gameType:
          type: string
        roomName:
          type: string
        roomId:
          type: string

    PrivateChatRequest:
      type: object
      required: [playerId, targetPlayerId]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1
        targetPlayerId:
          type: string
          minLength: 1
        roomName:
          type: string
        roomId:
          type: string

    JoinPayload:
      type: object
      required: [playerId]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1

    CreatePayload:
      type: object
      required: [playerId]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/HaggisCreateOptions"

    HaggisCreateOptions:
      type: object
      additionalProperties: false
      properties:
        playerCount:
          type: integer
          enum: [2, 3]
          description: Planned game size. Must match payload.players length when players is provided.
        players:
          type: array
          minItems: 2
          maxItems: 3
          uniqueItems: true
          description: >
            Optional in websocket create flow when room already has players.
            Required effectively by engine if room enrichment cannot provide at least 2 players.
          items:
            oneOf:
              - type: string
                minLength: 1
              - $ref: "#/components/schemas/HaggisCreatePlayer"
        seed:
          type: integer
          format: int32
          description: Optional deterministic shuffle seed. If omitted, backend selects seed automatically.
        options:
          $ref: "#/components/schemas/HaggisCreateGameOptions"

    HaggisCreatePlayer:
      type: object
      required: [playerId]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1
        type:
          type: string
          enum: [human, ai]
        ai:
          $ref: "#/components/schemas/HaggisAiOptions"

    HaggisAiOptions:
      type: object
      additionalProperties: false
      properties:
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          description: >
            1=random move, 2=heuristic, 3=montecarlo, 4=montecarlo (higher time budget),
            5=montecarlo (highest time budget).

    HaggisCreateGameOptions:
      type: object
      additionalProperties: false
      properties:
        winScore:
          type: integer
          minimum: 1
        scoring:
          $ref: "#/components/schemas/HaggisScoringOptions"

    HaggisScoringOptions:
      type: object
      additionalProperties: false
      properties:
        strategy:
          type: string
          enum: [StandardScoring, EveryCardOnePoint]
        runOutMultiplier:
          type: integer
        gameOverScore:
          type: integer
          minimum: 1

    CommandPayload:
      type: object
      required: [command]
      additionalProperties: false
      properties:
        command:
          $ref: "#/components/schemas/GameCommand"

    SnapshotPayload:
      type: object
      required: [playerId]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1

    GameRoomResponse:
      type: object
      required: [roomId, gameId, gameType, roomName, createdAt, players, gameEndpoint]
      additionalProperties: false
      properties:
        roomId:
          type: string
        gameId:
          type: string
        gameType:
          type: string
        roomName:
          type: string
        createdAt:
          type: string
          format: date-time
        players:
          type: array
          items:
            type: string
        gameEndpoint:
          type: string
          description: Realtime game endpoint path (`/ws/games/{gameId}`).

    GameCommand:
      oneOf:
        - $ref: "#/components/schemas/PlayCommand"
        - $ref: "#/components/schemas/PassCommand"

    PlayCommand:
      type: object
      required: [type, playerId, payload]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [Play]
        playerId:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/HaggisTrickActionPayload"

    PassCommand:
      type: object
      required: [type, playerId]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [Pass]
        playerId:
          type: string
          minLength: 1

    HaggisTrickActionPayload:
      type: object
      required: [trick]
      additionalProperties: false
      properties:
        trick:
          type: string
          minLength: 1

    GameChatMessage:
      type: object
      required: [playerId, text]
      additionalProperties: false
      properties:
        playerId:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1

    GameStateSnapshot:
      type: object
      required: [version, data, updatedAt]
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
        data:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
